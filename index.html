<style>
:root{--navy:#0a3d62;--navy2:#1a5276;--blue:#1976d2;--blue2:#42a5f5;--teal:#00897b;--green:#2e7d32;--green2:#43a047;--red:#c62828;--red2:#ef5350;--orange:#e65100;--yellow:#f57f17;--g50:#f8fafc;--g100:#f1f5f9;--g200:#e2e8f0;--g300:#cbd5e1;--g400:#94a3b8;--g500:#64748b;--g600:#475569;--g700:#334155;--g800:#1e293b;--g900:#0f172a;--white:#fff;--border:#e2e8f0;--sh:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);--sh2:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -1px rgba(0,0,0,.06);--sh3:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -2px rgba(0,0,0,.05);--r:12px;--rs:8px;--rl:16px;--font:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;--tr:.2s cubic-bezier(.4,0,.2,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--g50);color:var(--g800);min-height:100vh;overflow-x:hidden}
#app{display:flex;flex-direction:column;height:100vh}
.topbar{background:var(--navy);color:#fff;padding:0 16px;height:60px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25);flex-shrink:0}

.sync-badge.syncing{background:rgba(25,118,210,.25);color:#90caf9;animation:pulse 1s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.icon-btn{width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background var(--tr)}
.icon-btn:hover{background:rgba(255,255,255,.2)}
.main-content{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:80px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--border);display:flex;z-index:100;box-shadow:0 -4px 12px rgba(0,0,0,.08);padding-bottom:env(safe-area-inset-bottom)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;gap:3px;font-size:10px;font-weight:500;color:var(--g400);border:none;background:none;cursor:pointer;transition:color var(--tr);position:relative}
.nav-item span:first-child{font-size:20px}

.view{display:none}.view.active{display:block}

.dash-header{margin-bottom:20px}

.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
@media(min-width:640px){.stats-grid{grid-template-columns:repeat(4,1fr)}}
.stat-card{background:var(--white);border-radius:var(--r);padding:16px;box-shadow:var(--sh);border:1px solid var(--border);position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.stat-card.total::before{background:linear-gradient(90deg,var(--navy),var(--blue2))}
.stat-card.verified::before{background:linear-gradient(90deg,var(--green),#66bb6a)}
.stat-card.unverified::before{background:linear-gradient(90deg,var(--red),#ef9a9a)}
.stat-card.progress::before{background:linear-gradient(90deg,var(--yellow),#ffd54f)}
.stat-icon{font-size:24px;margin-bottom:8px}
.stat-value{font-size:28px;font-weight:800;font-family:var(--mono);color:var(--g900)}
.stat-label{font-size:11px;font-weight:600;color:var(--g500);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.stat-full{background:var(--white);border-radius:var(--r);padding:16px;box-shadow:var(--sh);border:1px solid var(--border);margin-bottom:16px;position:relative;overflow:hidden}
.stat-full::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--orange),#ffb74d)}
.progress-bar-wrap{background:var(--g100);border-radius:99px;height:10px;margin-top:10px;overflow:hidden}

.section-title{font-size:14px;font-weight:700;color:var(--g700);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.chart-wrap{background:var(--white);border-radius:var(--r);padding:16px;box-shadow:var(--sh);border:1px solid var(--border);margin-bottom:16px}
.bar-chart{display:flex;flex-direction:column;gap:8px}
.bar-row{display:flex;align-items:center;gap:8px;font-size:12px}
.bar-label{width:110px;color:var(--g600);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.bar-track{flex:1;background:var(--g100);border-radius:99px;height:8px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--blue2))}
.bar-count{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--g700);width:40px;text-align:right;flex-shrink:0}
.inv-header{position:sticky;top:60px;z-index:50;background:var(--white);border-bottom:1px solid var(--border);padding:12px 16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.search-bar{display:flex;gap:8px;margin-bottom:10px}
.search-input{flex:1;background:var(--g100);border:1.5px solid transparent;border-radius:10px;padding:10px 14px;font-size:14px;font-family:var(--font);transition:all var(--tr);outline:none}
.search-input:focus{border-color:var(--blue);background:var(--white);box-shadow:0 0 0 3px rgba(25,118,210,.1)}
.scan-btn{width:44px;height:44px;border-radius:10px;background:var(--navy);border:none;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.filter-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
