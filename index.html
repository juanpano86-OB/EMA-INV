<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a3d62">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EMA-INV">
<title>EMA-INV | Inventario EMAPAG-EP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght=300;400;500;600;700&family=JetBrains+Mono:wght=400;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0a3d62;--navy2:#1a5276;--blue:#1976d2;--blue2:#42a5f5;--teal:#00897b;--green:#2e7d32;--green2:#43a047;--red:#c62828;--red2:#ef5350;--orange:#e65100;--yellow:#f57f17;--g50:#f8fafc;--g100:#f1f5f9;--g200:#e2e8f0;--g300:#cbd5e1;--g400:#94a3b8;--g500:#64748b;--g600:#475569;--g700:#334155;--g800:#1e293b;--g900:#0f172a;--white:#fff;--border:#e2e8f0;--sh:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);--sh2:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -1px rgba(0,0,0,.06);--sh3:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -2px rgba(0,0,0,.05);--r:12px;--rs:8px;--rl:16px;--font:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;--tr:.2s cubic-bezier(.4,0,.2,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--g50);color:var(--g800);min-height:100vh;overflow-x:hidden}
#app{display:flex;flex-direction:column;height:100vh}
.topbar{background:var(--navy);color:#fff;padding:0 16px;height:60px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25);flex-shrink:0}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--blue2),var(--teal));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.topbar h1{font-size:16px;font-weight:700;letter-spacing:.5px}
.topbar small{font-size:11px;opacity:.65;display:block;margin-top:-2px}
.topbar-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.sync-badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;cursor:default;transition:all .3s}
.sync-badge.online{background:rgba(67,160,71,.25);color:#a5d6a7}
.sync-badge.offline{background:rgba(239,83,80,.2);color:#ef9a9a}
.sync-badge.syncing{background:rgba(25,118,210,.25);color:#90caf9;animation:pulse 1s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.icon-btn{width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,.1);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background var(--tr)}
.icon-btn:hover{background:rgba(255,255,255,.2)}
.main-content{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:80px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--border);display:flex;z-index:100;box-shadow:0 -4px 12px rgba(0,0,0,.08);padding-bottom:env(safe-area-inset-bottom)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;gap:3px;font-size:10px;font-weight:500;color:var(--g400);border:none;background:none;cursor:pointer;transition:color var(--tr);position:relative}
.nav-item span:first-child{font-size:20px}
.nav-item.active{color:var(--navy)}
.nav-item.active::after{content:'';position:absolute;top:0;left:25%;right:25%;height:3px;background:var(--navy);border-radius:0 0 4px 4px}
.view{display:none}.view.active{display:block}
.dashboard{padding:16px;max-width:900px;margin:0 auto}
.dash-header{margin-bottom:20px}
.dash-header h2{font-size:22px;font-weight:700;color:var(--g900)}
.dash-header p{font-size:13px;color:var(--g500);margin-top:2px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
@media(min-width:640px){.stats-grid{grid-template-columns:repeat(4,1fr)}}
.stat-card{background:var(--white);border-radius:var(--r);padding:16px;box-shadow:var(--sh);border:1px solid var(--border);position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.stat-card.total::before{background:linear-gradient(90deg,var(--navy),var(--blue2))}
.stat-card.verified::before{background:linear-gradient(90deg,var(--green),#66bb6a)}
.stat-card.unverified::before{background:linear-gradient(90deg,var(--red),#ef9a9a)}
.stat-card.progress::before{background:linear-gradient(90deg,var(--yellow),#ffd54f)}
.stat-icon{font-size:24px;margin-bottom:8px}
.stat-value{font-size:28px;font-weight:800;font-family:var(--mono);color:var(--g900)}
.stat-label{font-size:11px;font-weight:600;color:var(--g500);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.stat-full{background:var(--white);border-radius:var(--r);padding:16px;box-shadow:var(--sh);border:1px solid var(--border);margin-bottom:16px;position:relative;overflow:hidden}
.stat-full::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--orange),#ffb74d)}
.progress-bar-wrap{background:var(--g100);border-radius:99px;height:10px;margin-top:10px;overflow:hidden}
.progress-bar{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),#66bb6a);transition:width 1s ease}
.section-title{font-size:14px;font-weight:700;color:var(--g700);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.chart-wrap{background:var(--white);border-radius:var(--r);padding:16px;box-shadow:var(--sh);border:1px solid var(--border);margin-bottom:16px}
.bar-chart{display:flex;flex-direction:column;gap:8px}
.bar-row{display:flex;align-items:center;gap:8px;font-size:12px}
.bar-label{width:110px;color:var(--g600);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.bar-track{flex:1;background:var(--g100);border-radius:99px;height:8px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--blue2))}
.bar-count{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--g700);width:40px;text-align:right;flex-shrink:0}
.inv-header{position:sticky;top:60px;z-index:50;background:var(--white);border-bottom:1px solid var(--border);padding:12px 16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.search-bar{display:flex;gap:8px;margin-bottom:10px}
.search-input{flex:1;background:var(--g100);border:1.5px solid transparent;border-radius:10px;padding:10px 14px;font-size:14px;font-family:var(--font);transition:all var(--tr);outline:none}
.search-input:focus{border-color:var(--blue);background:var(--white);box-shadow:0 0 0 3px rgba(25,118,210,.1)}
.scan-btn{width:44px;height:44px;border-radius:10px;background:var(--navy);border:none;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.filter-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filter-chips::-webkit-scrollbar{display:none}
.chip{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--white);color:var(--g600);white-space:nowrap;transition:all var(--tr);flex-shrink:0}
.chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.green.active{background:var(--green);border-color:var(--green)}
.chip.red.active{background:var(--red);border-color:var(--red)}
.inv-list{padding:12px 16px;max-width:800px;margin:0 auto}
.asset-card{background:var(--white);border-radius:var(--r);border:1.5px solid var(--border);margin-bottom:10px;overflow:hidden;cursor:pointer;transition:all var(--tr);box-shadow:var(--sh)}
.asset-card:hover{box-shadow:var(--sh2);transform:translateY(-1px)}
.asset-card:active{transform:scale(.98)}
.asset-card-inner{display:flex}
.asset-status-bar{width:5px;flex-shrink:0}
.asset-status-bar.verified{background:var(--green2)}
.asset-status-bar.unverified{background:var(--red2)}
.asset-body{padding:12px;flex:1;min-width:0}
.asset-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
.asset-code{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--navy)}
.asset-status-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px;flex-shrink:0}
.badge-v{background:#e8f5e9;color:var(--green)}
.badge-nv{background:#ffebee;color:var(--red)}
.asset-name{font-size:13px;font-weight:500;color:var(--g800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
.asset-meta{display:flex;gap:6px;flex-wrap:wrap}
.asset-tag{font-size:11px;color:var(--g500);background:var(--g100);padding:2px 8px;border-radius:6px}
.empty-state{text-align:center;padding:60px 20px;color:var(--g400)}
.empty-state .emoji{font-size:48px;margin-bottom:12px}
.pagination{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px}
.page-btn{padding:8px 16px;border-radius:8px;border:1.5px solid var(--border);background:var(--white);color:var(--g700);font-size:13px;font-weight:500;cursor:pointer;transition:all var(--tr)}
.page-btn:hover{border-color:var(--navy);color:var(--navy)}
.page-btn:disabled{opacity:.4;cursor:not-allowed}
.page-info{font-size:12px;color:var(--g500);font-weight:500}
.form-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.5);backdrop-filter:blur(4px)}
.form-overlay.open{display:flex;flex-direction:column;justify-content:flex-end}
@media(min-width:768px){.form-overlay.open{justify-content:center;align-items:center}}
.form-sheet{background:var(--white);border-radius:20px 20px 0 0;max-height:95vh;display:flex;flex-direction:column;animation:slideUp .3s cubic-bezier(.32,.72,0,1);width:100%}
@media(min-width:768px){.form-sheet{border-radius:20px;max-width:580px;margin-bottom:0}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.form-drag{width:40px;height:4px;background:var(--g300);border-radius:4px;margin:10px auto 0}
.form-header{padding:16px 20px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.form-header h3{font-size:17px;font-weight:700;color:var(--g900)}
.close-btn{width:32px;height:32px;border-radius:50%;background:var(--g100);border:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--g600)}
.form-body{overflow-y:auto;padding:16px 20px;flex:1}
.form-section{margin-bottom:20px}
.form-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--g400);margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--g100)}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--g600);margin-bottom:5px}
.form-control{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:var(--font);color:var(--g800);background:var(--white);outline:none;transition:all var(--tr)}
.form-control:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(25,118,210,.1)}
select.form-control{cursor:pointer}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status-toggle{display:flex;gap:8px}
.status-btn{flex:1;padding:10px;border-radius:10px;border:2px solid var(--border);font-size:13px;font-weight:700;cursor:pointer;transition:all var(--tr);text-align:center;background:var(--white)}
.status-btn.v-opt{color:var(--green)}.status-btn.v-opt.sel{background:#e8f5e9;border-color:var(--green)}
.status-btn.nv-opt{color:var(--red)}.status-btn.nv-opt.sel{background:#ffebee;border-color:var(--red)}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.photo-slot{aspect-ratio:1;border-radius:10px;border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;background:var(--g50);position:relative;transition:border-color var(--tr)}
.photo-slot:hover{border-color:var(--blue)}
.photo-slot img{width:100%;height:100%;object-fit:cover}
.photo-slot .add-icon{font-size:24px;color:var(--g300)}
.photo-slot .rm-photo{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(198,40,40,.85);color:#fff;border:none;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.loc-btn{width:100%;padding:10px;border-radius:10px;border:1.5px solid var(--border);background:var(--white);font-size:13px;font-weight:500;color:var(--navy);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all var(--tr)}
.loc-btn:hover{border-color:var(--navy);background:var(--g50)}
.loc-text{font-size:12px;color:var(--g500);margin-top:4px;font-family:var(--mono)}
.form-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:10px;flex-shrink:0;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.btn-primary{flex:1;padding:12px;border-radius:12px;background:var(--navy);color:#fff;border:none;font-size:15px;font-weight:700;cursor:pointer;transition:all var(--tr)}
.btn-primary:hover{background:var(--navy2)}.btn-primary:active{transform:scale(.97)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-secondary{padding:12px 16px;border-radius:12px;background:var(--g100);color:var(--g700);border:none;font-size:15px;font-weight:600;cursor:pointer}
.scanner-overlay{display:none;position:fixed;inset:0;z-index:300;background:#000;flex-direction:column}
.scanner-overlay.open{display:flex}
.scanner-header{padding:20px 16px 10px;display:flex;align-items:center;gap:12px;color:#fff;position:relative;z-index:310}
.scanner-header h3{font-size:17px;font-weight:700}
#scanner-video{flex:1;object-fit:cover;width:100%}
.scanner-frame{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:240px;height:240px;border:2px solid rgba(255,255,255,.3);border-radius:16px;z-index:305}
.scanner-frame::before,.scanner-frame::after{content:'';position:absolute;width:40px;height:40px;border-color:#42a5f5;border-style:solid}
.scanner-frame::before{top:-2px;left:-2px;border-width:3px 0 0 3px;border-radius:16px 0 0 0}
.scanner-frame::after{bottom:-2px;right:-2px;border-width:0 3px 3px 0;border-radius:0 0 16px 0}
.scanner-hint{color:rgba(255,255,255,.7);text-align:center;padding:16px;font-size:14px;position:relative;z-index:310}
.manual-input-wrap{padding:16px;background:rgba(255,255,255,.05);display:flex;gap:8px;position:relative;z-index:310}
.manual-input{flex:1;padding:10px 14px;border-radius:10px;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;font-size:14px;outline:none;font-family:var(--mono)}
.manual-input::placeholder{color:rgba(255,255,255,.4)}
.manual-search-btn{padding:10px 16px;border-radius:10px;background:var(--blue);border:none;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
.export-view{padding:16px;max-width:700px;margin:0 auto}
.export-card{background:var(--white);border-radius:var(--r);padding:20px;box-shadow:var(--sh);border:1px solid var(--border);margin-bottom:16px}
.export-card h3{font-size:16px;font-weight:700;margin-bottom:6px}
.export-card p{font-size:13px;color:var(--g500);margin-bottom:16px}
.export-opt{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;border:1.5px solid var(--border);cursor:pointer;transition:all var(--tr);margin-bottom:8px}
.export-opt:hover{border-color:var(--navy);background:var(--g50)}
.export-opt-icon{font-size:20px;width:36px;height:36px;background:var(--g100);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.export-opt-text strong{display:block;font-size:13px;font-weight:600}
.export-opt-text small{font-size:11px;color:var(--g500)}
.btn-export{width:100%;padding:14px;border-radius:12px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border:none;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px}
.btn-export:hover{opacity:.9}
.corte-card{background:linear-gradient(135deg,#1a237e,var(--navy));color:#fff;border-radius:var(--r);padding:20px;margin-bottom:16px}
.corte-card h3{font-size:16px;font-weight:700;margin-bottom:6px}
.corte-card p{font-size:13px;opacity:.75;margin-bottom:16px}
.corte-info{display:flex;gap:10px;margin-bottom:14px}
.corte-stat{flex:1;background:rgba(255,255,255,.1);border-radius:10px;padding:10px;text-align:center}
.corte-stat .num{font-size:20px;font-weight:800;font-family:var(--mono)}
.corte-stat .lbl{font-size:10px;opacity:.7;margin-top:2px}
.btn-corte{width:100%;padding:12px;border-radius:10px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:background var(--tr)}
.btn-corte:hover{background:rgba(255,255,255,.25)}
.settings-view{padding:16px;max-width:700px;margin:0 auto}
.settings-section{margin-bottom:24px}
.settings-section h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--g400);margin-bottom:10px}
.settings-item{background:var(--white);border-radius:10px;border:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;cursor:pointer}
.settings-item-left{display:flex;align-items:center;gap:12px}
.settings-icon{font-size:20px}
.settings-label{font-size:14px;font-weight:500}
.settings-sub{font-size:12px;color:var(--g400);margin-top:1px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--g900);color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;font-weight:500;white-space:nowrap;opacity:0;transition:all .3s ease;z-index:999;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loading-overlay{position:fixed;inset:0;z-index:500;background:rgba(10,61,98,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff}
.loading-overlay.hidden{display:none}
.spinner{width:44px;height:44px;border:3px solid rgba(255,255,255,.2);border-top-color:#42a5f5;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-title{font-size:18px;font-weight:700}
.loading-sub{font-size:13px;opacity:.7}
.fab{position:fixed;bottom:84px;right:16px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--navy));color:#fff;border:none;font-size:24px;cursor:pointer;box-shadow:0 4px 14px rgba(10,61,98,.4);display:none;align-items:center;justify-content:center;z-index:90;transition:transform var(--tr),box-shadow var(--tr)}
.fab:hover{transform:scale(1.08);box-shadow:0 6px 20px rgba(10,61,98,.5)}
.fab:active{transform:scale(.95)}
.cloud-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
.cloud-dot.ok{background:#66bb6a}
.cloud-dot.err{background:#ef5350}
.cloud-dot.sync{background:#42a5f5;animation:pulse 1s ease infinite}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-title">💧 EMA-INV</div>
  <div class="loading-sub" id="loadingMsg">Conectando con Firebase...</div>
</div>

<div id="app">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px">
      <div class="logo-icon">💧</div>
      <div><h1>EMA-INV</h1><small>EMAPAG-EP</small></div>
    </div>
    <div class="topbar-actions">
      <span class="sync-badge offline" id="syncBadge">● OFFLINE</span>
    </div>
  </div>

  <div class="main-content">
    <div id="view-dashboard" class="view active">
      <div class="dashboard">
        <div class="dash-header">
          <h2>📊 Dashboard</h2>
          <p id="dashDate">—</p>
        </div>
        <div class="stats-grid">
          <div class="stat-card total"><div class="stat-icon">📦</div><div class="stat-value" id="statTotal">—</div><div class="stat-label">Total</div></div>
          <div class="stat-card verified"><div class="stat-icon">✅</div><div class="stat-value" id="statVerified" style="color:var(--green)">—</div><div class="stat-label">Verificados</div></div>
          <div class="stat-card unverified"><div class="stat-icon">⚠️</div><div class="stat-value" id="statUnverified" style="color:var(--red)">—</div><div class="stat-label">Pendientes</div></div>
          <div class="stat-card progress"><div class="stat-icon">📈</div><div class="stat-value" id="statPct" style="color:var(--orange)">—</div><div class="stat-label">Avance</div></div>
        </div>
        <div class="stat-full">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <span style="font-size:13px;font-weight:600;color:var(--g700)">Progreso de Verificación</span>
            <span id="pctLabel" style="font-size:13px;font-weight:700;color:var(--orange)">0%</span>
          </div>
          <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
        </div>
      </div>
    </div>

    <div id="view-inventory" class="view">
      <div class="inv-header">
        <div class="search-bar">
          <input type="text" class="search-input" id="searchInput" placeholder="🔍 Buscar activos..." oninput="handleSearch()">
          <button class="scan-btn" onclick="openScanner()">⬛</button>
        </div>
      </div>
      <div class="inv-list" id="invList"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item active" onclick="showView('dashboard')" id="nav-dashboard"><span>📊</span><span>Dashboard</span></button>
    <button class="nav-item" onclick="showView('inventory')" id="nav-inventory"><span>📋</span><span>Inventario</span></button>
  </nav>
</div>

<button class="fab" id="fabBtn" onclick="openNewAsset()">＋</button>

<div class="form-overlay" id="formOverlay" onclick="handleOverlayClick(event)">
  <div class="form-sheet" id="formSheet">
    <div class="form-drag"></div>
    <div class="form-header">
      <h3 id="formTitle">Activo</h3>
      <button class="close-btn" onclick="closeForm()">✕</button>
    </div>
    <div class="form-body">
      <div class="form-section">
        <div class="form-section-title">Estado de Verificación</div>
        <div class="status-toggle">
          <button class="status-btn v-opt" id="btnV" onclick="setStatus('VERIFICADO')">✅ VERIFICADO</button>
          <button class="status-btn nv-opt sel" id="btnNV" onclick="setStatus('NO VERIFICADO')">⚠️ NO VERIFICADO</button>
        </div>
      </div>
      <div class="form-section">
        <div class="form-section-title">Identificación</div>
        <div class="form-row">
          <div class="form-group"><label class="form-label">Código Emapag *</label><input type="text" class="form-control" id="fCodigo"></div>
          <div class="form-group"><label class="form-label">Descripción</label><input type="text" class="form-control" id="fDesc"></div>
        </div>
      </div>
    </div>
    <div class="form-footer">
      <button class="btn-secondary" onclick="closeForm()">Cancelar</button>
      <button class="btn-primary" id="btnSave" onclick="saveAsset()">Guardar</button>
    </div>
  </div>
</div>

<div class="scanner-overlay" id="scannerOverlay">
  <div class="scanner-header">
    <h3>📷 Escanear Código</h3>
    <button class="close-btn" onclick="closeScanner()">✕</button>
  </div>
  <video id="scanner-video" autoplay playsinline></video>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBdZQgfcQH1XvMxomQMLQWMA4LNloGezx8",
  authDomain: "emapag-etiquetas.firebaseapp.com",
  projectId: "emapag-etiquetas",
  storageBucket: "emapag-etiquetas.firebasestorage.app",
  messagingSenderId: "704717908882",
  appId: "1:704717908882:web:76a50e8a953b575d376f4b"
};

let assets = [];
let currentAssetStatus = 'NO VERIFICADO';
let db;

try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  db.enablePersistence().catch(err => console.warn("Modo offline no activo:", err.code));
} catch (e) {
  console.error("Error Firebase:", e);
}

function showView(viewId) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById(`view-${viewId}`).classList.add('active');
  document.getElementById(`nav-${viewId}`).classList.add('active');
  document.getElementById('fabBtn').style.display = (viewId === 'inventory') ? 'flex' : 'none';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function openNewAsset() {
  document.getElementById('formTitle').innerText = "Nuevo Activo";
  document.getElementById('fCodigo').value = "";
  document.getElementById('fDesc').value = "";
  setStatus('NO VERIFICADO');
  document.getElementById('formOverlay').classList.add('open');
}

function closeForm() { document.getElementById('formOverlay').classList.remove('open'); }
function handleOverlayClick(e) { if(e.target.id === 'formOverlay') closeForm(); }

function setStatus(status) {
  currentAssetStatus = status;
  if(status === 'VERIFICADO') {
    document.getElementById('btnV').classList.add('sel');
    document.getElementById('btnNV').classList.remove('sel');
  } else {
    document.getElementById('btnNV').classList.add('sel');
    document.getElementById('btnV').classList.remove('sel');
  }
}

function renderList() {
  const container = document.getElementById('invList');
  if(!container) return;
  if(assets.length === 0) {
    container.innerHTML = '<p style="padding:20px;text-align:center;color:#94a3b8">No hay activos en la nube</p>';
    return;
  }
  let html = '';
  assets.forEach(a => {
    html += `
      <div class="asset-card">
        <div class="asset-card-inner">
          <div class="asset-status-bar ${a.estado === 'VERIFICADO' ? 'verified' : 'unverified'}"></div>
          <div class="asset-body" style="padding:12px">
            <div style="display:flex;justify-content:between"><strong>${a.codigoEmapag}</strong></div>
            <div style="font-size:13px;color:#475569">${a.descripcion || 'Sin descripción'}</div>
          </div>
        </div>
      </div>`;
  });
  container.innerHTML = html;
}

function updateDashboardStats() {
  const total = assets.length;
  const verified = assets.filter(x => x.estado === 'VERIFICADO').length;
  const unverified = total - verified;
  const pct = total > 0 ? Math.round((verified / total) * 100) : 0;
  
  document.getElementById('statTotal').innerText = total;
  document.getElementById('statVerified').innerText = verified;
  document.getElementById('statUnverified').innerText = unverified;
  document.getElementById('statPct').innerText = `${pct}%`;
  document.getElementById('pctLabel').innerText = `${pct}%`;
  document.getElementById('progressBar').style.width = `${pct}%`;
}

function saveAsset() {
  const cod = document.getElementById('fCodigo').value.trim();
  if(!cod) return showToast("Código requerido");
  
  const data = {
    codigoEmapag: cod,
    descripcion: document.getElementById('fDesc').value.trim(),
    estado: currentAssetStatus
  };
  
  db.collection("activos").doc(cod).set(data, { merge: true })
    .then(() => { showToast("💾 Guardado"); closeForm(); })
    .catch(() => showToast("Error al guardar"));
}

function initRealtime() {
  db.collection("activos").onSnapshot((snapshot) => {
    assets = [];
    snapshot.forEach(doc => assets.push(doc.data()));
    renderList();
    updateDashboardStats();
    document.getElementById('loadingOverlay').classList.add('hidden');
  }, (err) => {
    console.error("Error Snapshot:", err);
  });
}

window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('dashDate').innerText = new Date().toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  initRealtime();
});
</script>
</body>
</html>
